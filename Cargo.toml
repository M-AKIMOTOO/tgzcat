[package]
name = "tgzcat-reader"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "reader.rs"
crate-type = ["staticlib"]

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["zlib-rs"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
